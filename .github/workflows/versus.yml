name: Versus Rapfi

# Measure Tengen against Rapfi (https://github.com/dhbloo/rapfi), the
# strongest open-source gomoku engine: once with its NNUE evaluation and once
# with its classical evaluation only. Both play with the official weights
# from https://github.com/dhbloo/rapfi-networks. Start it from the Actions
# tab; every game is played (no early stop), so the Elo is unbiased. With
# players set to rapfi, Rapfi's NNUE plays its classical evaluation instead;
# with rapfi-candidates, Rapfi classical with rapfi_candidates plays Rapfi
# classical with its configured range (square3_line4). rapfi_candidates and
# tengen_candidates set the candidate moves of each engine, so both can be
# compared on the same range.
on:
  workflow_dispatch:
    inputs:
      games:
        description: Games per opponent
        default: "400"
      turn_ms:
        description: Milliseconds per move
        default: "200"
      match_ms:
        description: Milliseconds per side for the whole game (0 for none), as in Gomocup
        default: "0"
      tengen_turn_ms:
        description: Milliseconds per move for Tengen only (time odds; empty for the same as Rapfi)
        default: ""
      max_depth:
        description: Deepest iteration for both engines (empty for none); raise turn_ms so depth binds
        default: ""
      memory_mb:
        description: Memory per engine in MiB (Gomocup 2026 allows 1024)
        default: "160"
      size:
        description: Board size
        type: choice
        options: ["15", "20"]
        default: "15"
      rule:
        description: Game rule (Rapfi plays freestyle, standard and renju)
        type: choice
        options: [freestyle, standard, renju]
        default: freestyle
      players:
        description: Tengen against both Rapfis, Rapfi NNUE against Rapfi classical, or Rapfi classical with rapfi_candidates against its own range
        type: choice
        options: [tengen, rapfi, rapfi-candidates]
        default: tengen
      rapfi_candidates:
        description: Rapfi's candidate range (empty for its configuration's, square3_line4)
        type: choice
        options: ["", square2, square2_line3, square3, square3_line4, square4]
        default: ""
      tengen_candidates:
        description: Tengen's candidate range (empty for its default)
        type: choice
        options: ["", square1_line2, square1_line3, square2, square2_line3, square3, square3_line4, square4]
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.0"

jobs:
  rapfi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dhbloo/rapfi
          path: rapfi
      - uses: actions/checkout@v7
        with:
          repository: dhbloo/rapfi-networks
          path: networks
      - name: Build Rapfi
        run: |
          cmake -S rapfi/Rapfi -B build -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SSE=ON -DUSE_AVX2=ON -DUSE_AVX512=OFF -DUSE_BMI2=OFF -DUSE_VNNI=OFF -DNO_COMMAND_MODULES=ON
          cmake --build build -j "$(nproc)"
          strip build/pbrain-rapfi
      - name: Set up both evaluations
        run: |
          mkdir -p dist/nnue dist/classical
          cp build/pbrain-rapfi dist/nnue/
          cp build/pbrain-rapfi dist/classical/
          cp networks/config-example/config.toml networks/classical/*.bin networks/mix9svq/* dist/nnue/
          cp networks/config-example/gomocalc-classical260809.toml dist/classical/config.toml
          cp networks/classical/*.bin dist/classical/
          range="${{ inputs.rapfi_candidates }}"
          if [ -n "$range" ]; then
            # A copy of the classical Rapfi with the candidate range set, and
            # for Tengen's matches the same range for both opponents.
            mkdir -p dist/classical-cand
            cp -r dist/classical/. dist/classical-cand/
            configs=dist/classical-cand/config.toml
            [ "${{ inputs.players }}" = rapfi-candidates ] || configs="$configs dist/nnue/config.toml dist/classical/config.toml"
            for config in $configs; do
              sed -i "s/^default_candidate_range = .*/default_candidate_range = \"$range\"/" "$config"
              grep -q "^default_candidate_range = \"$range\"" "$config"
            done
          fi
          {
            echo '### Rapfi'
            echo "rapfi $(git -C rapfi rev-parse --short HEAD), networks $(git -C networks rev-parse --short HEAD)"
            echo "candidates: Rapfi ${{ inputs.rapfi_candidates || 'square3_line4' }}, Tengen ${{ inputs.tengen_candidates || 'default' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: rapfi
          path: dist

  match:
    needs: rapfi
    strategy:
      fail-fast: false
      matrix:
        evaluation: [nnue, classical]
        # Four machines share each opponent's games.
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: cargo build --release -p tengen-piskvork -p tengen-arena
      - uses: actions/download-artifact@v8
        with:
          name: rapfi
          path: rapfi
      - name: Play
        if: >-
          inputs.players == 'tengen' || (inputs.players == 'rapfi' && matrix.evaluation == 'nnue')
          || (inputs.players == 'rapfi-candidates' && matrix.evaluation == 'classical')
        run: |
          chmod +x rapfi/*/pbrain-rapfi
          new=target/release/pbrain-tengen
          [ -n "${{ inputs.tengen_candidates }}" ] && new="$new --candidates ${{ inputs.tengen_candidates }}"
          base=rapfi/${{ matrix.evaluation }}/pbrain-rapfi
          title="Tengen against Rapfi (${{ matrix.evaluation }})"
          if [ "${{ inputs.players }}" = rapfi ]; then
            new=rapfi/nnue/pbrain-rapfi
            base=rapfi/classical/pbrain-rapfi
            title="Rapfi NNUE against Rapfi classical"
          fi
          if [ "${{ inputs.players }}" = rapfi-candidates ]; then
            test -n "${{ inputs.rapfi_candidates }}"
            new=rapfi/classical-cand/pbrain-rapfi
            base=rapfi/classical/pbrain-rapfi
            title="Rapfi classical with ${{ inputs.rapfi_candidates }} against square3_line4"
          fi
          {
            echo "### $title (part ${{ matrix.shard }} of 4)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # The balanced-openings book for the rule and size, when there is one.
          book="crates/arena/openings/${{ inputs.rule }}-${{ inputs.size }}.txt"
          openings=""
          [ -f "$book" ] && openings="--openings $book"
          odds=""
          [ "${{ inputs.players }}" = tengen ] && [ -n "${{ inputs.tengen_turn_ms }}" ] && odds="--new-turn-ms ${{ inputs.tengen_turn_ms }}"
          [ -n "${{ inputs.max_depth }}" ] && odds="$odds --max-depth ${{ inputs.max_depth }}"
          target/release/tengen-arena $openings $odds \
            --new "$new" \
            --base "$base" \
            --games $(( ${{ inputs.games }} / 4 )) \
            --turn-ms ${{ inputs.turn_ms }} \
            --match-ms ${{ inputs.match_ms }} \
            --memory-mb ${{ inputs.memory_mb }} \
            --size ${{ inputs.size }} \
            --rule ${{ inputs.rule }} \
            --concurrency "$(nproc)" \
            --record games.txt \
            --seed "${{ github.run_id }}${{ matrix.shard }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: games-${{ matrix.evaluation }}-${{ matrix.shard }}
          path: games.txt
