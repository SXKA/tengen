name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, exe: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p tengen-piskvork --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="tengen-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/pbrain-tengen${{ matrix.exe }}" "$name/"
          cp LICENSE README.md "$name/"
          if [ "${{ matrix.exe }}" = ".exe" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: tengen-*.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum tengen-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" tengen-* SHA256SUMS \
            --title "Tengen ${GITHUB_REF_NAME}" \
            --notes-file ../.github/release-notes.md \
            --verify-tag
