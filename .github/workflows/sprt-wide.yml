name: SPRT (parallel)

# Play this branch against another ref on many machines at once: each shard
# plays a fixed share of the games, then the results are pooled and the SPRT
# bounds are checked once on the total. Checking only at the end makes the
# test a little more conservative than the sequential one. Start it from the
# Actions tab. new_args and base_args are passed to each engine, so a change
# of parameters (--params name=value,...) or candidates (--candidates RANGE)
# can be tested from master without a branch.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Ref to test against
        default: master
      elo0:
        description: H0 Elo
        default: "0"
      elo1:
        description: H1 Elo
        default: "5"
      games:
        description: Games in all, split evenly between the shards
        default: "16000"
      shards:
        description: Machines to play on (at most 16)
        type: choice
        options: ["4", "8", "12", "16"]
        default: "16"
      turn_ms:
        description: Milliseconds per move
        default: "100"
      match_ms:
        description: Milliseconds per game for each side (0 for no game clock)
        default: "0"
      new_args:
        description: Arguments for the new engine, e.g. --params lmr_base=80 (no spaces inside a value)
        default: ""
      base_args:
        description: Arguments for the base engine
        default: ""
      rule:
        description: Game rule (both versions must support it)
        type: choice
        options: [freestyle, standard, renju, caro, freestyle-caro]
        default: freestyle

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so new lints or codegen changes arrive in deliberate updates.
  RUST_VERSION: "1.97.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: new
      - uses: actions/checkout@v7
        with:
          path: base
          ref: ${{ inputs.base }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build both versions
        run: |
          cargo build --release --manifest-path new/Cargo.toml -p tengen-piskvork -p tengen-arena
          cargo build --release --manifest-path base/Cargo.toml -p tengen-piskvork
          mkdir dist
          cp new/target/release/pbrain-tengen dist/new
          cp new/target/release/tengen-arena dist/arena
          cp base/target/release/pbrain-tengen dist/base
          book="new/crates/arena/openings/${{ inputs.rule }}-15.txt"
          [ -f "$book" ] && cp "$book" dist/openings.txt
          true
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist

  shards:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: echo "list=[$(seq -s, 1 ${{ inputs.shards }})]" >> "$GITHUB_OUTPUT"

  play:
    needs: [build, shards]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - name: Play
        run: |
          chmod +x dist/new dist/base dist/arena
          openings=""
          [ -f dist/openings.txt ] && openings="--openings dist/openings.txt"
          # Games come in pairs (colours swapped), so keep each share even.
          games=$(( ${{ inputs.games }} / ${{ inputs.shards }} / 2 * 2 ))
          dist/arena $openings \
            --new "dist/new ${{ inputs.new_args }}" \
            --base "dist/base ${{ inputs.base_args }}" \
            --games "$games" \
            --turn-ms ${{ inputs.turn_ms }} \
            --match-ms ${{ inputs.match_ms }} \
            --rule ${{ inputs.rule }} \
            --concurrency "$(nproc)" \
            --seed "${{ github.run_id }}${{ matrix.shard }}" | tee result.md
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.shard }}
          path: result.md

  verdict:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
      - name: Pool the shards
        env:
          ELO0: ${{ inputs.elo0 }}
          ELO1: ${{ inputs.elo1 }}
          NEW_ARGS: ${{ inputs.new_args }}
          BASE_ARGS: ${{ inputs.base_args }}
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          # Same statistics as crates/arena/src/sprt.rs: pentanomial pair
          # scores, normal approximation of the generalized SPRT.
          import glob, math, os, re
          counts, wins, draws, losses, shards = [0] * 5, 0, 0, 0, 0
          for path in sorted(glob.glob("results/*/result.md")):
              m = re.search(r"\| (\d+) \| (\d+) \| (\d+) \| (\d+) \| [^|]+\| \[([\d, ]+)\] \|", open(path).read())
              if not m:
                  continue
              shards += 1
              wins, draws, losses = wins + int(m[2]), draws + int(m[3]), losses + int(m[4])
              counts = [a + int(b) for a, b in zip(counts, m[5].split(","))]
          c = [x + 1e-3 for x in counts]
          n = sum(c)
          mean = sum(x * i / 4 for i, x in enumerate(c)) / n
          var = sum(x * (i / 4 - mean) ** 2 for i, x in enumerate(c)) / n
          elo_of = lambda s: -400 * math.log10(1 / min(max(s, 1e-6), 1 - 1e-6) - 1)
          score_of = lambda e: 1 / (1 + 10 ** (-e / 400))
          margin = 1.96 * math.sqrt(var / n)
          elo, err = elo_of(mean), (elo_of(mean + margin) - elo_of(mean - margin)) / 2
          e0, e1 = float(os.environ["ELO0"]), float(os.environ["ELO1"])
          s0, s1 = score_of(e0), score_of(e1)
          llr = n * (s1 - s0) * (2 * mean - s0 - s1) / (2 * var)
          lower, upper = math.log(0.05 / 0.95), math.log(0.95 / 0.05)
          verdict = ("H1 accepted: the new version is stronger" if llr >= upper
                     else "H0 accepted: no improvement" if llr <= lower else "inconclusive")
          print("## Tengen arena, pooled\n")
          print(f"{shards} shards, turn ${{ inputs.turn_ms }} ms, match ${{ inputs.match_ms }} ms, rule ${{ inputs.rule }}\n")
          for name in ("NEW_ARGS", "BASE_ARGS"):
              if os.environ.get(name):
                  print(f"{name.split('_')[0].lower()} engine: `{os.environ[name]}`\n")
          print("| games | wins | draws | losses | Elo (95%) | pentanomial |")
          print("|---|---|---|---|---|---|")
          print(f"| {wins + draws + losses} | {wins} | {draws} | {losses} | {elo:+.1f} ± {err:.1f} | {counts} |")
          print(f"\nSPRT [{e0:g}, {e1:g}]: LLR {llr:.2f} (bounds {lower:.2f}, {upper:.2f}), {verdict}")
          EOF
