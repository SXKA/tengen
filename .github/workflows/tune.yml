name: Tune

# Self-play games on several machines at once, fit the evaluation and the
# move-ordering tables to them, and check the fitted weights against the
# current ones with an SPRT. Start it from the Actions tab. The weights and
# games are attached to the run, and the weights are also pushed to the
# branch tune/<run id>, ready for a pull request: as weights.txt for
# freestyle, weights-RULE.txt for the other rules.
#
# With a teacher, Rapfi evaluates every position the fit trains on, and the
# fit learns those evaluations instead of only the game results. With an
# earlier run as well, its labels are reused unless relabel is set.
on:
  workflow_dispatch:
    inputs:
      games:
        description: Self-play games per machine (8 machines)
        default: "5000"
      nodes:
        description: Nodes per move
        default: "20000"
      reuse_run:
        description: Fit the games of this earlier Tune run instead of playing new ones (run id)
        default: ""
      rule:
        description: Game rule
        type: choice
        options: [freestyle, standard, renju, caro, freestyle-caro]
        default: freestyle
      teacher:
        description: Rapfi evaluation that labels the positions (freestyle, standard and renju only)
        type: choice
        options: [none, nnue, classical]
        default: none
      teacher_nodes:
        description: Nodes Rapfi searches per position
        default: "20000"
      lambda:
        description: Share of the teacher in the targets (the rest is the game result)
        default: "1"
      per_code:
        description: Also refine every pattern code on its own
        type: boolean
        default: false
      mode:
        description: Fit every table, or only the threat or the move-ordering tables of the current weights
        type: choice
        options: [full, threat, policy]
        default: full
      relabel:
        description: With a teacher and an earlier run, label its games again instead of reusing its labels
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: cargo build --release -p tengen-piskvork -p tengen-arena
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            target/release/pbrain-tengen
            target/release/tengen-arena
            target/release/tengen-tune

  selfplay:
    needs: build
    if: inputs.reuse_run == ''
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
      - name: Self-play
        run: |
          chmod +x tengen-tune
          ./tengen-tune selfplay --games ${{ inputs.games }} --nodes ${{ inputs.nodes }} --rule ${{ inputs.rule }} \
            --seed "${{ github.run_id }}${{ matrix.shard }}" --out games-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: games-${{ matrix.shard }}
          path: games-${{ matrix.shard }}.txt

  rapfi:
    if: inputs.teacher != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dhbloo/rapfi
          path: rapfi
      - uses: actions/checkout@v7
        with:
          repository: dhbloo/rapfi-networks
          path: networks
      - name: Build Rapfi
        run: |
          cmake -S rapfi/Rapfi -B build -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SSE=ON -DUSE_AVX2=ON -DUSE_AVX512=OFF -DUSE_BMI2=OFF -DUSE_VNNI=OFF -DNO_COMMAND_MODULES=ON
          cmake --build build -j "$(nproc)"
          strip build/pbrain-rapfi
      - name: Set up the evaluation
        run: |
          mkdir -p dist
          cp build/pbrain-rapfi dist/
          if [ "${{ inputs.teacher }}" = nnue ]; then
            cp networks/config-example/config.toml networks/classical/*.bin networks/mix9svq/* dist/
          else
            cp networks/config-example/gomocalc-classical260809.toml dist/config.toml
            cp networks/classical/*.bin dist/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: rapfi
          path: dist

  label:
    needs: [build, selfplay, rapfi]
    if: ${{ !cancelled() && inputs.teacher != 'none' && (inputs.reuse_run == '' || inputs.relabel) && needs.rapfi.result == 'success' && needs.selfplay.result != 'failure' }}
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
      - uses: actions/download-artifact@v8
        with:
          name: rapfi
          path: rapfi
      - uses: actions/download-artifact@v8
        if: inputs.reuse_run == ''
        with:
          name: games-${{ matrix.shard }}
      - uses: actions/download-artifact@v8
        if: inputs.reuse_run != ''
        with:
          name: games-${{ matrix.shard }}
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Label
        run: |
          chmod +x tengen-tune rapfi/pbrain-rapfi
          ./tengen-tune label --data games-${{ matrix.shard }}.txt --brain rapfi/pbrain-rapfi \
            --nodes ${{ inputs.teacher_nodes }} --out labelled-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: labelled-${{ matrix.shard }}
          path: labelled-${{ matrix.shard }}.txt

  fit:
    needs: [build, selfplay, label]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Download the earlier run's games
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: games-*
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Download the earlier run's labels
        if: inputs.reuse_run != '' && inputs.teacher != 'none' && !inputs.relabel
        uses: actions/download-artifact@v8
        with:
          pattern: labelled-*
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Fit
        run: |
          chmod +x artifacts/pbrain-tengen artifacts/tengen-arena artifacts/tengen-tune
          if [ "${{ inputs.teacher }}" = none ]; then
            cat artifacts/games-*.txt > games.txt
          else
            cat artifacts/labelled-*.txt > games.txt
          fi
          rule="${{ inputs.rule }}"
          current=crates/engine/src/weights.txt
          [ "$rule" = freestyle ] || current="crates/engine/src/weights-$rule.txt"
          # Rules without their own file use the freestyle weights.
          [ -f "$current" ] || current=crates/engine/src/weights.txt
          if [ "${{ inputs.mode }}" = policy ]; then
            artifacts/tengen-tune fit-policy --data games.txt --weights "$current" --out weights.txt 2>&1 | tee fit.log
          elif [ "${{ inputs.mode }}" = threat ]; then
            artifacts/tengen-tune fit-threat --data games.txt --lambda ${{ inputs.lambda }} --weights "$current" \
              --rule "$rule" --out weights.txt 2>&1 | tee fit.log
          else
            per_code=""
            [ "${{ inputs.per_code }}" = true ] && per_code=--per-code
            artifacts/tengen-tune fit --data games.txt --lambda ${{ inputs.lambda }} $per_code --out eval.txt 2>&1 | tee fit.log
            artifacts/tengen-tune fit-policy --data games.txt --weights eval.txt --out weights.txt 2>&1 | tee -a fit.log
          fi
          { echo '### Fit'; echo '```'; cat fit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check against the current weights
        run: |
          artifacts/tengen-arena \
            --new "artifacts/pbrain-tengen --weights weights.txt" \
            --base artifacts/pbrain-tengen \
            --games 4000 --turn-ms 100 --sprt 0,10 --rule ${{ inputs.rule }} \
            --concurrency "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push the weights to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "tune/${{ github.run_id }}"
          rule="${{ inputs.rule }}"
          file=crates/engine/src/weights.txt
          [ "$rule" = freestyle ] || file="crates/engine/src/weights-$rule.txt"
          cp weights.txt "$file"
          git add "$file"
          git commit -m "Evaluation and move-ordering weights for $rule from Tune run ${{ github.run_id }}"
          git push origin "tune/${{ github.run_id }}"
      - uses: actions/upload-artifact@v7
        with:
          name: tuning
          path: |
            weights.txt
            fit.log
            games.txt
