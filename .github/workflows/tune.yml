name: Tune

# Self-play games, fit the evaluation weights to their results, and check the
# fitted weights against the current ones with an SPRT. Start it from the
# Actions tab; the weights and games are attached to the run. Adopt the
# weights by copying them to crates/engine/src/weights.txt.
on:
  workflow_dispatch:
    inputs:
      games:
        description: Self-play games
        default: "20000"
      nodes:
        description: Nodes per move
        default: "20000"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so new lints or codegen changes arrive in deliberate updates.
  RUST_VERSION: "1.97.0"

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: cargo build --release -p tengen-piskvork -p tengen-arena
      - name: Self-play
        run: target/release/tengen-tune selfplay --games ${{ inputs.games }} --nodes ${{ inputs.nodes }} --seed "${{ github.run_id }}" --out games.txt
      - name: Fit
        run: |
          target/release/tengen-tune fit --data games.txt --out weights.txt 2>&1 | tee fit.log
          { echo '### Fit'; echo '```'; cat fit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check against the current weights
        run: |
          target/release/tengen-arena \
            --new "target/release/pbrain-tengen --weights weights.txt" \
            --base target/release/pbrain-tengen \
            --games 2000 --turn-ms 100 --sprt 0,10 \
            --concurrency "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: tuning
          path: |
            weights.txt
            fit.log
            games.txt
