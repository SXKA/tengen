name: SPSA

# Tune the search parameters listed in tuning/spsa.txt by self-play with
# SPSA (see crates/arena/src/bin/spsa.rs). Start it from the Actions tab.
# The tuned values are in the run summary; check them with the SPRT
# workflow before adopting them as the defaults in search.rs.
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: Game pairs (the schedule assumes all are played)
        default: "12000"
      minutes:
        description: Stop after this many minutes even if pairs remain
        default: "320"
      turn_ms:
        description: Milliseconds per move
        default: "50"
      rule:
        description: Game rule
        type: choice
        options: [freestyle, standard, renju, caro, freestyle-caro]
        default: freestyle

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.0"

jobs:
  spsa:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: cargo build --release -p tengen-piskvork -p tengen-arena
      - name: Tune
        run: |
          target/release/tengen-spsa \
            --brain target/release/pbrain-tengen \
            --spec tuning/spsa.txt \
            --pairs ${{ inputs.pairs }} \
            --minutes ${{ inputs.minutes }} \
            --turn-ms ${{ inputs.turn_ms }} \
            --rule ${{ inputs.rule }} \
            --concurrency "$(nproc)" \
            --seed "${{ github.run_id }}" | tee -a "$GITHUB_STEP_SUMMARY"
